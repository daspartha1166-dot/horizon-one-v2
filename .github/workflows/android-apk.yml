
name: Build Horizon One V2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Horizen-final.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Verify and extract source ZIP
        run: |
          test -f Horizen-final.zip
          mkdir -p extracted
          unzip -q Horizen-final.zip -d extracted
          echo "ZIP extracted successfully"
          find extracted -maxdepth 5 -type f | head -150

      - name: Find Android Gradle project
        id: project
        shell: bash
        run: |
          FILE=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Android Gradle project found."
            exit 0
          fi

          PROJECT_DIR="$(dirname "$FILE")"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build debug APK
        if: steps.project.outputs.found == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle --no-daemon assembleDebug
          else
            echo "Gradle build file missing."
            exit 1
          fi

      - name: Collect APK
        if: steps.project.outputs.found == 'true'
        run: |
          mkdir -p apk-output
          find extracted -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} apk-output/ \;

          if ! find apk-output -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "APK was not generated."
            exit 1
          fi

          ls -lh apk-output

      - name: Explain missing Android project
        if: steps.project.outputs.found != 'true'
        run: |
          echo "::error::No Android Gradle project was found in Horizen-final.zip."
          echo "The ZIP may contain HTML, CSS, and JavaScript only."
          echo "An Android wrapper is required to build an APK."
          exit 1

      - name: Upload APK artifact
        if: steps.project.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-One-V2-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
          
