
name: Build Horizon One V2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Horizen-final.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          test -f "$HOME/.android/debug.keystore"

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract source ZIP
        run: |
          test -f Horizen-final.zip
          mkdir -p extracted
          unzip -q Horizen-final.zip -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android Gradle project
        id: project
        shell: bash
        run: |
          FILE=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "No Android Gradle project found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$FILE")"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle wrapper not found in $PROJECT_DIR"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK files
        shell: bash
        run: |
          mkdir -p apk-output

          find extracted -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' \
            -exec cp {} apk-output/ \;

          if ! find apk-output -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "Build finished but no APK was found."
            find extracted -type d -path '*/build/outputs/*' -print
            exit 1
          fi

          ls -lh apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-One-V2-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
          
