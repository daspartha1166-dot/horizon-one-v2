
name: Build Horizon One V2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          test -f "$HOME/.android/debug.keystore"

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Horizen-final (1).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Source ZIP not found: $ZIP_FILE"
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "No Android Gradle project found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$FILE")"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle wrapper not found in $PROJECT_DIR"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Patch missing Jetpack Compose imports
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              "app/src/main/kotlin/com/metrolist/music/ui/detail/AlbumScreen.kt": [
                  "import androidx.compose.ui.unit.dp"
              ],
              "app/src/main/kotlin/com/metrolist/music/ui/detail/LocalPlaylistScreen.kt": [
                  "import androidx.compose.ui.unit.dp"
              ],
              "app/src/main/kotlin/com/metrolist/music/ui/detail/PlaylistScreen.kt": [
                  "import androidx.compose.ui.unit.dp"
              ],
              "app/src/main/kotlin/com/metrolist/music/ui/onboarding/OnboardingScreen.kt": [
                  "import androidx.compose.foundation.layout.ExperimentalLayoutApi"
              ],
              "app/src/main/kotlin/com/metrolist/music/ui/profile/ProfileScreen.kt": [
                  "import androidx.compose.foundation.layout.ExperimentalLayoutApi"
              ],
          }

          for relative, imports in fixes.items():
              path = Path(relative)
              if not path.is_file():
                  raise SystemExit(f"Expected source file missing: {path}")
              content = path.read_text()
              package_line = next(
                  (line for line in content.splitlines() if line.startswith("package ")),
                  None,
              )
              if package_line is None:
                  raise SystemExit(f"Package declaration missing: {path}")
              missing = [item for item in imports if item not in content.splitlines()]
              if missing:
                  content = content.replace(
                      package_line,
                      package_line + "\n" + "\n".join(missing),
                      1,
                  )
                  path.write_text(content)
              print(f"Checked imports: {path}")
          PY

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apk-output

          find extracted -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' \
            -exec cp {} apk-output/ \;

          if ! find apk-output -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "Build finished but no APK was found."
            find extracted -type d \
              -path '*/build/outputs/*' -print
            exit 1
          fi

          echo "APK files generated:"
          ls -lh apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-One-V2-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
          
